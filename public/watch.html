<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watch - Lumen</title>
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="watch.css">
    <!-- No CSP meta tag here: the server (helmet) already sends the CSP and allows https://vid.pl -->
    <style>
        .player {
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }
 
        .player[hidden] {
            display: none;
        }
 
        #video-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>
 
<body>
 
    <header class="navbar">
        <a href="index.html" class="logo" aria-label="Lumen home">Lumen</a>
 
        <form class="search" role="search" action="search.html" method="get">
            <label for="q" class="visually-hidden">Search movies</label>
            <input type="search" id="q" name="q" placeholder="Search movies, actors, genres">
            <button type="submit">Search</button>
        </form>
 
        <a href="login.html" class="btn btn-login">Log in</a>
    </header>
 
    <main class="watch-page">
        <div class="watch-head">
            <h1 id="watch-title">Loading...</h1>
            <a id="details-link" href="index.html" class="back-link">&larr; Movie details</a>
        </div>
 
        <!-- Messages: "no video yet", errors, and so on -->
        <p id="status" class="row-message" aria-live="polite"></p>
 
        <!-- The external player (one single element with id="player") -->
        <div id="player" class="player" hidden>
            <iframe 
            id="video-frame" 
            title="Lumen movie player" 
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen referrerpolicy="origin"></iframe>
        </div>
    </main>
 
    <footer class="footer">
        <p>Lumen. A learning project, built with HTML, CSS and JavaScript.</p>
    </footer>
    <script src="js/watch.js" defer></script>
    <script src="js/nav.js" defer></script>
    <script src="js/footer.js" defer></script>
</body>
 
</html>
