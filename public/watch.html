<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Watch - Lumen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="watch.css">
    <!-- No CSP meta tag here: the server (helmet) already sends the CSP and allows https://vid.pl -->
    <style>
        .player {
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
        }

        /* ---------- Season / episode bar (yellow and white) ---------- */
        .episode-bar {
            --accent: #ffc929;
            --accent-soft: #ffd95a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            max-width: 1100px;
            margin: 0 auto 14px;
            padding: 12px 16px;
            background: #15151a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .episode-bar[hidden] {
            display: none;
        }

        .episode-bar .field {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
        }

        .episode-bar .field span {
            color: var(--accent);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .episode-bar input[type="number"] {
            width: 4.5em;
            padding: 8px 10px;
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            color: #fff;
            background: #0b0b0e;
            border: 2px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            -moz-appearance: textfield;
            appearance: textfield;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .episode-bar input[type="number"]::-webkit-outer-spin-button,
        .episode-bar input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .episode-bar input[type="number"]:hover {
            border-color: rgba(255, 255, 255, 0.55);
        }

        .episode-bar input[type="number"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 201, 41, 0.25);
        }

        .episode-bar button {
            font: inherit;
            font-weight: 700;
            padding: 9px 20px;
            border-radius: 999px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s, transform 0.1s, border-color 0.15s;
        }

        .episode-bar button:active {
            transform: scale(0.96);
        }

        .episode-bar button:focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px;
        }

        /* Previous: white outline, fills white on hover */
        #prev-episode {
            margin-left: auto;
            color: #fff;
            background: transparent;
            border: 2px solid #fff;
        }

        #prev-episode:hover {
            color: #111;
            background: #fff;
        }

        /* Next: solid yellow */
        #next-episode {
            color: #111;
            background: var(--accent);
            border: 2px solid var(--accent);
        }

        #next-episode:hover {
            background: var(--accent-soft);
            border-color: var(--accent-soft);
        }

        @media (max-width: 560px) {
            .episode-bar {
                gap: 10px;
            }

            #prev-episode {
                margin-left: 0;
            }

            .episode-bar button {
                flex: 1;
            }
        }

        .player[hidden] {
            display: none;
        }

        #video-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo" aria-label="Lumen home">Lumen</a>

        <form class="search" role="search" action="search.html" method="get">
            <label for="q" class="visually-hidden">Search movies</label>
            <input type="search" id="q" name="q" placeholder="Search movies, actors, genres">
            <button type="submit">Search</button>
        </form>

        <a href="login.html" class="btn btn-login">Log in</a>
    </header>

    <main class="watch-page">
        <div class="watch-head">
            <h1 id="watch-title">Loading...</h1>
            <a id="details-link" href="index.html" class="back-link">&larr; Movie details</a>
        </div>

        <!-- Messages: "no video yet", errors, and so on -->
        <p id="status" class="row-message" aria-live="polite"></p>

        <!-- Season / episode picker: watch.js shows it only for tv shows and animes -->
        <div id="episode-bar" class="episode-bar" hidden>
            <label class="field"><span>Season</span> <input type="number" id="season-input" min="1" max="9999" value="1"></label>
            <label class="field"><span>Episode</span> <input type="number" id="episode-input" min="1" max="9999" value="1"></label>
            <button type="button" id="prev-episode">&larr; Previous</button>
            <button type="button" id="next-episode">Next &rarr;</button>
        </div>

        <!-- The external player (one single element with id="player") -->
        <div id="player" class="player" hidden>
            <iframe id="video-frame" title="Lumen movie player" allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen referrerpolicy="origin"></iframe>
        </div>
    </main>

    <footer class="footer">
        <p>Lumen. A learning project, built with HTML, CSS and JavaScript.</p>
    </footer>
    <script src="js/watch.js" defer></script>
    <script src="js/nav.js" defer></script>
    <script src="js/footer.js" defer></script>
</body>

</html>
