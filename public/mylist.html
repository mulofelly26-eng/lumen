<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My List - Lumen</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="search.css">
    <style>
        .list-item { display: grid; gap: 8px; align-content: start; }
        .list-remove {
            padding: 6px 10px; background: transparent; color: var(--muted);
            border: 1px solid #2a3144; border-radius: 6px;
            font: inherit; font-size: 0.85rem; cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
        }
        .list-remove:hover { color: #ff8a8a; border-color: #ff8a8a; }
        .list-remove:disabled { opacity: 0.5; cursor: wait; }
    </style>
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo" aria-label="Lumen home">Lumen</a>

        <form class="search" role="search" action="search.html" method="get">
            <label for="q" class="visually-hidden">Search movies</label>
            <input type="search" id="q" name="q" placeholder="Search movies, actors, genres">
            <button type="submit">Search</button>
        </form>

        <a href="login.html" class="btn btn-login">Log in</a>
    </header>

    <main class="search-page">
        <h1>My List</h1>
        <p id="status" class="row-message" aria-live="polite">Loading your list...</p>
        <div id="results" class="results"></div>
    </main>

    <footer class="footer">
        <p>Lumen. A learning project, built with HTML, CSS and JavaScript.</p>
    </footer>

    <script src="js/nav.js" defer></script>
    <script src="js/mylist.js" defer></script>
</body>
</html>
